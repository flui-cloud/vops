<meta name="apple-mobile-web-app-title" content="vops" />
<!-- Apply the saved theme before first paint — Alpine boots at the end of the
     document, so waiting for init() would flash light at dark-theme users. -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem('vops-theme')||'light'}catch{}</script>
<!-- Registers the worker that backs the installed app. Failure is non-fatal:
     the dashboard works fine in a normal tab without it. -->
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
<!--TAILWIND-->
