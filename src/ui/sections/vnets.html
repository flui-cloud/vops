      <section x-show="view==='vnets'">
        <div class="mb-4 text-sm" style="color:var(--text-dim)"><span x-text="vnets.length"></span> network(s) on <span class="capitalize" x-text="provider"></span></div>
        <div class="card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead><tr>
                <th class="th">ID</th><th class="th">Name</th><th class="th">IP range</th><th class="th">Subnets</th><th class="th">Servers</th><th class="th"></th>
              </tr></thead>
              <tbody>
                <template x-if="loading">
                  <template x-for="i in 3" :key="i">
                    <tr class="row"><td class="td" colspan="6"><div class="skel h-4 w-full max-w-[520px]"></div></td></tr>
                  </template>
                </template>
                <template x-for="v in vnets" :key="v.id">
                  <tr class="row cursor-pointer" @click="openDrawer('vnet', v)">
                    <td class="td font-mono text-xs" style="color:var(--text-faint)" x-text="v.id"></td>
                    <td class="td font-semibold" style="color:var(--text)" x-text="v.name"></td>
                    <td class="td font-mono text-xs" x-text="v.ipRange"></td>
                    <td class="td font-mono" x-text="v.subnets.length"></td>
                    <td class="td font-mono" x-text="v.attachedServerIds.length"></td>
                    <td class="td text-right" style="color:var(--text-faint)">›</td>
                  </tr>
                </template>
                <tr x-show="!vnets.length && !loading"><td class="td" style="color:var(--text-faint)" colspan="6">No networks.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
