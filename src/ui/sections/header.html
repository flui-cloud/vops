      <div class="mb-6 flex flex-wrap items-start justify-between gap-5" x-show="view!=='host'">
        <div>
          <h1 class="text-[26px] font-bold leading-none tracking-tight" x-text="pageTitle">Overview</h1>
          <p class="mt-1.5 text-sm" style="color:var(--text-dim)" x-text="subtitle"></p>
        </div>
        <div class="flex flex-none items-center gap-2.5">
          <!-- Hosted companions. Outbound only, and only when clicked — the
               dashboard itself never reaches out. -->
          <div class="flex items-center gap-0.5">
            <a class="icon-link" href="https://vops.flui.cloud" target="_blank" rel="noopener noreferrer"
              title="Compare online — vops.flui.cloud, the public price comparator">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.3 3.6 8.5S14.4 18.2 12 20.5C9.6 18.2 8.4 15.2 8.4 12S9.6 5.8 12 3.5Z"/></svg>
            </a>
            <a class="icon-link" href="https://vops.flui.cloud/watch/" target="_blank" rel="noopener noreferrer"
              title="Your alerts — availability, price and uptime monitor that keeps running with vops closed">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            </a>
          </div>
          <!-- Vault chip. Absent for an unsealed profile: there is nothing to lock. -->
          <button x-show="vault.state==='locked'" class="flex items-center gap-1.5 rounded-[9px] px-2.5 py-2 text-[12.5px]"
            style="color:var(--warn);background:var(--warn-soft);border:1px solid var(--accent-border)"
            title="Your credentials are sealed — click to unlock" @click="vaultOpen()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>Locked
          </button>
          <button x-show="vault.state==='unlocked'" class="flex items-center gap-1.5 rounded-[9px] px-2.5 py-2 text-[12.5px]"
            style="color:var(--text-faint);background:var(--panel);border:1px solid var(--border)"
            :title="'Vault open' + (vaultExpiresLabel() ? ' — ' + vaultExpiresLabel() : '') + '. Click to lock it now.'" @click="vaultLock()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7a4 4 0 0 1 7.9-.6"/></svg>Unlocked
          </button>

          <div class="flex items-center gap-1.5 rounded-[9px] px-3 py-2 text-[12.5px]" x-show="view==='overview'"
            style="color:var(--text-faint);background:var(--panel);border:1px solid var(--border)">
            <span class="h-1.5 w-1.5 rounded-full" style="background:var(--ok)"></span>synced <span x-text="syncedLabel"></span>
          </div>
          <div class="seg" x-show="showsProvider">
            <template x-for="p in providerIds" :key="p">
              <button class="seg-btn capitalize" :class="provider===p && 'seg-btn-active'" @click="setProvider(p)" x-text="p"></button>
            </template>
          </div>
          <div class="seg" x-show="view==='servers'">
            <template x-for="t in serverTabs" :key="t">
              <button class="seg-btn capitalize" :class="serverTab===t && 'seg-btn-active'" @click="setServerTab(t)" x-text="t"></button>
            </template>
          </div>
          <button class="btn-ghost" x-show="view!=='sshkeys'" @click="reload()" :disabled="loading">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              class="transition-transform duration-500" :style="loading ? 'transform:rotate(360deg)' : ''"><path d="M20 11A8 8 0 1 0 18 16"/><path d="M20 5v6h-6"/></svg>Refresh
          </button>
          <button class="btn-primary" x-show="primaryAction" @click="runPrimary()" x-text="primaryAction"></button>
          <button class="btn-ghost" x-show="view==='sshkeys'" @click="openImportForm()">Import existing</button>
        </div>
      </div>

      <div x-show="error" class="mb-4 rounded-[10px] px-4 py-3 text-sm" style="color:var(--danger);background:var(--danger-soft);border:1px solid var(--accent-border)">
        <span x-text="error"></span>
      </div>
