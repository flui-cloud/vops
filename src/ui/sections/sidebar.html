  <aside class="flex w-[252px] shrink-0 flex-col px-3 pb-3.5 pt-3" style="background:var(--side);border-right:1px solid var(--border)">
    <div class="flex items-center gap-3 px-2 pb-3 pt-0.5">
      <img src="assets/icon_transparent.png" alt="vops" width="38" height="38" class="h-[38px] w-[38px] shrink-0" />
      <div class="leading-tight">
        <div class="text-[15px] font-bold tracking-tight">vops</div>
        <div class="text-[11.5px]" style="color:var(--text-faint)">control plane</div>
      </div>
    </div>

    <!-- min-h-0 lets the nav shrink below its content so it scrolls instead of
         overflowing the fixed-height aside; the theme toggle stays pinned. -->
    <nav class="nav-scroll flex min-h-0 flex-1 flex-col overflow-y-auto"
      :style="`--fade-top:${navFade.top}px;--fade-bottom:${navFade.bottom}px`"
      x-init="$nextTick(() => navScrollState($el))"
      @scroll="navScrollState($el)" @resize.window="navScrollState($el)">
      <template x-for="sec in nav" :key="sec.section">
        <div>
          <div class="nav-section" x-text="sec.section"></div>
          <template x-for="item in sec.items" :key="item.id">
            <button class="nav-item" :class="{ 'nav-item-active': view===item.id, 'nav-item-soon': !!item.soon }"
              :disabled="!!item.soon" :title="item.soon ? 'Coming soon' : ''" @click="go(item.id)">
              <span x-show="view===item.id" class="absolute -left-3 top-1/2 h-[18px] w-[3px] -translate-y-1/2 rounded" style="background:var(--accent)"></span>
              <span x-html="item.icon" class="flex" :style="view===item.id ? '' : 'color:var(--text-faint)'"></span>
              <span x-text="item.label"></span>
              <template x-if="item.soon"><span class="pill-soon">soon</span></template>
              <template x-if="item.id==='availability' && (ov.alerts?.count||0) > 0">
                <span class="ml-auto flex items-center gap-1.5 text-[11px] font-semibold" style="color:var(--warn)">
                  <span class="h-1.5 w-1.5 rounded-full" style="background:var(--warn)"></span><span x-text="ov.alerts.count"></span>
                </span>
              </template>
              <template x-if="item.pill !== undefined && countFor(item.id) !== null">
                <span class="count-pill" x-text="countFor(item.id)"></span>
              </template>
            </button>
          </template>
        </div>
      </template>
    </nav>

    <!-- Only the theme preference lives down here; every destination stays a labelled
         row in the nav above. Monochrome on purpose — chrome, not a concept icon. -->
    <div class="mx-0.5 flex items-center gap-1">
      <button class="nav-icon" :class="theme==='light' && 'nav-icon-active'" @click="setTheme('light')"
        title="Light theme" :aria-pressed="theme==='light'">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.7v2.1M12 19.2v2.1M2.7 12h2.1M19.2 12h2.1M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/></svg>
      </button>
      <button class="nav-icon" :class="theme==='dark' && 'nav-icon-active'" @click="setTheme('dark')"
        title="Dark theme" :aria-pressed="theme==='dark'">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 14.9A8.6 8.6 0 1 1 9.1 3.6a6.7 6.7 0 0 0 11.3 11.3Z"/></svg>
      </button>
    </div>
  </aside>
