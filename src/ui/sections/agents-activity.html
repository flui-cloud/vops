<div class="card overflow-hidden">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b px-5 py-4" style="border-color:var(--border)">
    <div>
      <div class="text-sm font-semibold">What the agents did</div>
      <p class="mt-1 text-xs" style="color:var(--text-faint)">Every run, newest first. A succeeded run whose verification is degraded did not leave the target healthy.</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <select class="input text-xs" x-model="agentActivityFilter.session">
        <option value="">All sessions</option>
        <template x-for="session in agentControl.sessions" :key="session.id">
          <option :value="session.id" x-text="session.actor.displayName + ' · ' + session.id.slice(0,12)"></option>
        </template>
      </select>
      <select class="input text-xs" x-model="agentActivityFilter.outcome">
        <option value="">Any outcome</option>
        <option value="succeeded">Succeeded</option>
        <option value="failed">Failed</option>
        <option value="cancelled">Cancelled</option>
        <option value="running">Running</option>
      </select>
      <select class="input text-xs" x-model="agentActivityFilter.verification">
        <option value="">Any verification</option>
        <option value="passed">Verified healthy</option>
        <option value="degraded">Degraded</option>
        <option value="failed">Verification failed</option>
        <option value="not_verified">Not verified</option>
      </select>
    </div>
  </div>
  <div class="divide-y" style="border-color:var(--border)">
    <template x-for="row in filteredAgentActivity()" :key="row.operationId">
      <div class="px-5 py-3">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2 text-xs">
              <span class="font-mono" style="color:var(--text-faint)" x-text="new Date(row.at).toLocaleString()"></span>
              <span class="font-medium" x-text="row.actor"></span>
              <span class="count-pill" :style="agentOutcomeStyle(row.outcome)" x-text="row.outcome"></span>
              <span class="count-pill" :style="agentVerificationStyle(row.verification)" x-text="agentVerificationLabel(row)"></span>
              <span style="color:var(--text-faint)" x-text="agentDuration(row.durationMs)"></span>
            </div>
            <div class="mt-1 text-sm" x-text="row.headline + (row.target ? ' — ' + row.target : '')"></div>
            <div x-show="row.error" class="mt-1 text-xs" style="color:var(--danger)" x-text="row.error"></div>
          </div>
          <div class="flex gap-2">
            <button class="btn-secondary text-[11px]" @click="toggleAgentActivity(row.operationId)"
              x-text="expandedAgentActivity===row.operationId ? 'Hide' : 'Details'"></button>
            <button x-show="row.outcome==='running'" class="btn-secondary text-[11px]" @click="cancelAgentOperation(row.operationId)">Cancel</button>
          </div>
        </div>
        <div x-show="expandedAgentActivity===row.operationId" x-cloak class="mt-3 rounded p-3 text-[11px]" style="background:var(--side)">
          <div class="font-mono" style="color:var(--text-faint)" x-text="row.operationId + ' · plan ' + row.planId + ' · session ' + row.sessionId"></div>
          <template x-for="step in row.steps" :key="step.step">
            <div class="mt-1" x-text="step.step + '  ' + step.action + (step.detail ? '  → ' + step.detail : '')"></div>
          </template>
          <div x-show="row.failedChecks.length" class="mt-2" style="color:var(--warn)"
            x-text="'Checks that did not pass: ' + row.failedChecks.join(', ')"></div>
        </div>
      </div>
    </template>
    <div x-show="filteredAgentActivity().length===0" class="px-5 py-6 text-sm" style="color:var(--text-faint)">
      Nothing matches this filter.
    </div>
  </div>
</div>
