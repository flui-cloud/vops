kind: CatalogApp
apiVersion: flui/v1

metadata:
  id: actual-budget
  name: Actual Budget
  description: >
    A fast, private, local-first envelope-budgeting app. Zero-based budgeting,
    bank-sync via optional connectors, and full multi-device sync through your
    own server — your financial data never leaves it.
  appKind: APPLICATION
  category: productivity
  tags:
    - finance
    - budgeting
    - local-first
    - privacy
    - self-hosted
  license: MIT
  version: "26.7.0"
  maintainedAt: "2026-07-23"
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/actual-budget.svg
  links:
    website: https://actualbudget.org
    docs: https://actualbudget.org/docs/
    source: https://github.com/actualbudget/actual
  ratings:
    wow: 4
    utility: 5
    euFit: 5
    community: 5
  alternativeTo:
    - YNAB
    - Mint

spec:
  type: standalone
  privatizable: true

  image:
    registry: docker.io
    repository: actualbudget/actual-server
    tag: "26.7.0"

  ports:
    - name: http
      internal: 5006
      expose: true
      protocol: http

  volumes:
    - name: data
      mountPath: /data
      required: true
      size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  scaling:
    horizontal:
      enabled: false
    vertical:
      enabled: true
      mode: Recreate
      bounds:
        cpu:
          min: 100m
          max: "2"
        memory:
          min: 128Mi
          max: 1Gi
      updatePolicy:
        trigger:
          - OOMKilled
        cooldown: 5m

  healthcheck:
    type: http
    path: /
    port: 5006
    initialDelay: 10s
    interval: 15s
    timeout: 5s
    retries: 8

  domain:
    auto: true
    userCustomizable: true
    tls: true

  access:
    mode: firstVisit
    note: On first open you set the server password — that becomes the login for every device. Open the URL to claim it.
  auth:
    mode: native

  smokeTest:
    type: http
    path: /
    expectedStatus: 200
    timeoutSeconds: 60
    retries: 12
