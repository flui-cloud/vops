kind: CatalogApp
apiVersion: flui/v1

metadata:
  id: baserow
  name: Baserow
  description: >
    Open-source no-code database and Airtable alternative: build spreadsheets,
    apps and APIs over your own data. This all-in-one image bundles Postgres and
    Redis, so it runs as a single container with no extra services to wire up.
  appKind: APPLICATION
  category: productivity
  tags:
    - no-code
    - database
    - airtable-alternative
    - spreadsheet
    - api
  license: MIT
  version: "2.3.3"
  maintainedAt: "2026-07-23"
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/baserow.svg
  links:
    website: https://baserow.io
    docs: https://baserow.io/docs
    source: https://gitlab.com/baserow/baserow
  ratings:
    wow: 4
    utility: 5
    euFit: 5
    community: 4
  alternativeTo:
    - Airtable
    - NocoDB

spec:
  type: standalone
  privatizable: true

  image:
    registry: docker.io
    repository: baserow/baserow
    tag: "2.3.3"

  ports:
    - name: http
      internal: 80
      expose: true
      protocol: http

  volumes:
    - name: data
      mountPath: /baserow/data
      required: true
      size: 10Gi

  # Baserow's bundled Caddy (and its Nuxt frontend) route strictly by Host: anything
  # that is not one of these URLs' hosts is treated as a published application-builder
  # domain and 404s. The public URL therefore MUST be the deploy hostname, and the
  # loopback has to stay on the extra list or the 127.0.0.1 smoke test 404s too.
  env:
    - name: BASEROW_PUBLIC_URL
      value: "https://{{app.domain}}"
      userEditable: true
      description: Public base URL Baserow serves links from — resolved to the domain this install is exposed on.
    - name: BASEROW_EXTRA_PUBLIC_URLS
      value: "http://127.0.0.1"
      userEditable: true
      description: Additional hosts Baserow answers on (comma-separated) — keeps loopback access working alongside the domain.

  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

  scaling:
    horizontal:
      enabled: false
    vertical:
      enabled: true
      mode: Recreate
      bounds:
        cpu:
          min: 300m
          max: "4"
        memory:
          min: 512Mi
          max: 4Gi
      updatePolicy:
        trigger:
          - OOMKilled
        cooldown: 5m

  healthcheck:
    type: http
    path: /
    port: 80
    initialDelay: 30s
    interval: 15s
    timeout: 5s
    retries: 20

  domain:
    auto: true
    userCustomizable: true
    tls: true

  access:
    mode: firstVisit
    note: The first account you create becomes the Baserow admin — open the URL to sign up and claim it.
  auth:
    mode: native

  smokeTest:
    type: http
    path: /
    expectedStatus: 200
    timeoutSeconds: 150
    retries: 30
