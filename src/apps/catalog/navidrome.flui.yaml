kind: CatalogApp
apiVersion: flui/v1

metadata:
  id: navidrome
  name: Navidrome
  description: >
    Modern, fast, self-hosted music server and streamer compatible with the
    Subsonic/OpenSubsonic API. Stream your own library to dozens of mobile and
    desktop apps, with multi-user support and no cloud dependency.
  appKind: APPLICATION
  category: media
  tags:
    - media
    - music
    - streaming
    - subsonic
    - privacy
  license: GPL-3.0
  version: "0.63.2"
  maintainedAt: "2026-07-23"
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/navidrome.svg
  links:
    website: https://www.navidrome.org
    docs: https://www.navidrome.org/docs/
    source: https://github.com/navidrome/navidrome
  ratings:
    wow: 4
    utility: 5
    euFit: 5
    community: 5
  alternativeTo:
    - Spotify
    - Plex Music
    - Apple Music

spec:
  type: standalone
  privatizable: true

  image:
    registry: docker.io
    repository: deluan/navidrome
    tag: "0.63.2"

  ports:
    - name: http
      internal: 4533
      expose: true
      protocol: http

  volumes:
    - name: data
      mountPath: /data
      required: true
      size: 2Gi
    - name: music
      mountPath: /music
      required: true
      size: 20Gi

  env: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  scaling:
    horizontal:
      enabled: false
    vertical:
      enabled: true
      mode: Recreate
      bounds:
        cpu:
          min: 100m
          max: "2"
        memory:
          min: 128Mi
          max: 1Gi
      updatePolicy:
        trigger:
          - OOMKilled
        cooldown: 5m

  healthcheck:
    type: http
    path: /
    port: 4533
    interval: 30s
    timeout: 5s
    retries: 3

  domain:
    auto: true
    userCustomizable: true
    tls: true

  access:
    mode: firstVisit
    note: The first account you create becomes the admin — open the URL now to claim it.
  auth:
    mode: native

  smokeTest:
    type: http
    path: /
    expectedStatus: 200
    timeoutSeconds: 90
    retries: 20
