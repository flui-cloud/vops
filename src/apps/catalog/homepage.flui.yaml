kind: CatalogApp
apiVersion: flui/v1

metadata:
  id: homepage
  name: Homepage
  description: >
    A modern, fast, fully static homelab start page: bookmarks, service tiles
    with live status, and 100+ widgets for the apps you run. Configured in
    plain YAML, everything renders on the server.
  appKind: APPLICATION
  category: monitoring
  tags:
    - dashboard
    - startpage
    - homelab
    - widgets
    - monitoring
  license: GPL-3.0
  version: "1.13.2"
  maintainedAt: "2026-07-23"
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/homepage.svg
  links:
    website: https://gethomepage.dev
    docs: https://gethomepage.dev/latest/
    source: https://github.com/gethomepage/homepage
  ratings:
    wow: 4
    utility: 4
    euFit: 4
    community: 5
  alternativeTo:
    - Heimdall
    - Organizr
    - Dashy

spec:
  type: standalone
  privatizable: true

  image:
    registry: ghcr.io
    repository: gethomepage/homepage
    tag: "v1.13.2"

  ports:
    - name: http
      internal: 3000
      expose: true
      protocol: http

  volumes:
    - name: config
      mountPath: /app/config
      required: true
      size: 1Gi

  env:
    # Homepage's middleware compares the Host header against this list by EXACT string,
    # port included, and only on /api/* — so it never affects the loopback smoke test on
    # `/`, and "*" would leave the API answering any host (DNS-rebinding). {{app.domain}}
    # is the deploy hostname behind an ingress and the loopback host:port a bare install
    # actually answers on. localhost:3000, 127.0.0.1:3000 and [::1]:3000 are always
    # allowed by the app itself.
    - name: HOMEPAGE_ALLOWED_HOSTS
      value: "{{app.domain}}"
      userEditable: true
      description: >
        Comma-separated Host headers allowed to reach Homepage's API — exact match,
        including the port. Defaults to the domain this install is deployed on (or the
        loopback host:port of a domain-less install). Add further hosts if you reach
        Homepage under another name; "*" turns the guard off.

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  scaling:
    horizontal:
      enabled: false
    vertical:
      enabled: true
      mode: Recreate
      bounds:
        cpu:
          min: 100m
          max: "1"
        memory:
          min: 128Mi
          max: 512Mi
      updatePolicy:
        trigger:
          - OOMKilled
        cooldown: 5m

  healthcheck:
    type: http
    path: /
    port: 3000
    interval: 30s
    timeout: 5s
    retries: 3

  domain:
    auto: true
    userCustomizable: true
    tls: true

  access:
    mode: none
    note: >
      Homepage has no built-in login — keep it private or put an authenticating
      reverse proxy in front of it before exposing it publicly.
  auth:
    mode: none

  smokeTest:
    type: http
    path: /
    expectedStatus: 200
    timeoutSeconds: 90
    retries: 20
