kind: CatalogApp
apiVersion: flui/v1

metadata:
  id: dozzle
  name: Dozzle
  description: >
    Real-time log viewer for Docker containers in the browser — live tail,
    search, and per-container streams with no database and no log shipping.
    Reads the host Docker socket; nothing is persisted.
  appKind: TOOL
  category: monitoring
  tags:
    - docker
    - logs
    - monitoring
    - real-time
  license: MIT
  version: "10.6.11"
  maintainedAt: "2026-07-23"
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/dozzle.svg
  links:
    website: https://dozzle.dev
    docs: https://dozzle.dev/guide/getting-started
    source: https://github.com/amir20/dozzle
  ratings:
    wow: 3
    utility: 4
    euFit: 4
    community: 4
  alternativeTo:
    - Datadog Logs
    - Grafana Loki
    - docker logs

spec:
  type: standalone
  privatizable: true

  image:
    registry: docker.io
    repository: amir20/dozzle
    tag: "v10.6.11"

  ports:
    - name: http
      internal: 8080
      expose: true
      protocol: http

  env: []

  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 300m
      memory: 128Mi

  scaling:
    horizontal:
      enabled: false
    vertical:
      enabled: true
      mode: Recreate
      bounds:
        cpu:
          min: 50m
          max: 500m
        memory:
          min: 32Mi
          max: 256Mi
      updatePolicy:
        trigger:
          - OOMKilled
        cooldown: 5m

  healthcheck:
    type: http
    path: /
    port: 8080
    interval: 30s
    timeout: 5s
    retries: 3

  domain:
    auto: true
    userCustomizable: true
    tls: true

  access:
    mode: none
    note: >
      Dozzle ships with no login by default — anyone who can reach the URL
      sees your container logs. Keep it private or enable Dozzle's own auth.
  auth:
    mode: native

  smokeTest:
    type: http
    path: /
    expectedStatus: 200
    timeoutSeconds: 90
    retries: 20
